<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>pahang.dev</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
  >

  <style>
    :root {
      --pico-font-family-monospace:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        Menlo,
        monospace;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    header a {
      font-family: var(--pico-font-family-monospace);
      font-size: 12px;
      font-weight: 400;
      text-decoration: none;
      color: #555555;
    }

    header a:hover {
      color: #555555;
      text-decoration: none;
    }

    @media (prefers-color-scheme: dark) {
      header a,
      header a:hover {
        color: #9a9a9a;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="/">pahang.dev</a>
  </header>
</body>
</html>
