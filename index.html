<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>pahang.dev</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
  >

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 5rem;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        "Courier New",
        monospace;
    }

    main {
      width: auto;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .brand {
      margin: 0;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      margin-left: 0.18em;
      vertical-align: -0.12em;
      background: currentColor;
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes blink {
      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
      }
    }

    @media (max-width: 576px) {
      body {
        padding-top: 4rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="brand">
      pahang.dev<span class="cursor" aria-hidden="true"></span>
    </p>
  </main>
</body>
</html>
